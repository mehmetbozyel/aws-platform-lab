apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"

spec:
  project: default

  source:
    repoURL: https://github.com/mehmetbozyel/aws-platform-lab.git
    targetRevision: main
    path: gitops/platform/namespaces

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true