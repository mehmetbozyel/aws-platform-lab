apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-config-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"

spec:
  project: default

  source:
    repoURL: https://github.com/mehmetbozyel/aws-platform-lab.git
    targetRevision: main
    path: gitops/platform/external-secrets
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    syncOptions:
      - PruneLast=true
      - SkipDryRunOnMissingResource=true