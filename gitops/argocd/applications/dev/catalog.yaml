
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catalog-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/mehmetbozyel/aws-platform-lab.git
    targetRevision: main
    path: helm/catalog
    helm:
      releaseName: catalog
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: retail-store

  syncPolicy:
    syncOptions:
      - PruneLast=true
