apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orders-db
  namespace: retail-store

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  target:
    name: orders-db
    creationPolicy: Owner

  data:
    - secretKey: username
      remoteRef:
        key: REPLACE_WITH_ORDERS_RDS_SECRET_ARN
        property: username

    - secretKey: password
      remoteRef:
        key: REPLACE_WITH_ORDERS_RDS_SECRET_ARN
        property: password