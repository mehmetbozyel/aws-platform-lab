
name: Build and Push Retail Store Images

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - ".github/workflows/build-push-ecr.yaml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retail-image-build-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 059865587119.dkr.ecr.eu-central-1.amazonaws.com
  ECR_PREFIX: aws-platform-lab-dev

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.select.outputs.services }}

    steps:
      - uses: actions/checkout@v6

      - name: Detect source changes
        if: github.event_name == 'push'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cart:
              - 'apps/cart/**'
            catalog:
              - 'apps/catalog/**'
            checkout:
              - 'apps/checkout/**'
            orders:
              - 'apps/orders/**'
            ui:
              - 'apps/ui/**'

      - name: Select services
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'services=["cart","catalog","checkout","orders","ui"]' \
              >> "$GITHUB_OUTPUT"
          else
            echo "services=$CHANGED" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.service }}
    needs: changes

    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image tag
        id: image
        env:
          GIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          SHORT_SHA="${GIT_SHA:0:12}"
          TAG="sha-${SHORT_SHA}-${RUN_ID}-${RUN_ATTEMPT}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./apps/${{ matrix.service }}
          file: ./apps/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true

          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_PREFIX }}/${{ matrix.service }}:${{ steps.image.outputs.tag }}

          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Print image reference
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          echo "${ECR_REGISTRY}/${ECR_PREFIX}/${SERVICE}:${IMAGE_TAG}"

  update-image-tags:
    name: Update Helm image tags
    needs:
      - changes
      - build

    if: >-
      ${{ needs.build.result == 'success' &&
          needs.changes.outputs.services != '[]' &&
          github.ref == 'refs/heads/main' }}

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update Helm values and push
        shell: bash
        env:
          SERVICES_JSON: ${{ needs.changes.outputs.services }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          SHORT_SHA="${SOURCE_SHA:0:12}"
          IMAGE_TAG="sha-${SHORT_SHA}-${RUN_ID}-${RUN_ATTEMPT}"

          echo "Promoting image tag: ${IMAGE_TAG}"

          for attempt in 1 2 3 4 5; do
            echo "Git push attempt: ${attempt}"

            # Start with latest main branch state.
            git fetch origin main
            git checkout -B main origin/main

            python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          allowed = {"cart", "catalog", "checkout", "orders", "ui"}

          services = json.loads(os.environ["SERVICES_JSON"])
          source_sha = os.environ["SOURCE_SHA"]
          short_sha = source_sha[:12]
          run_id = os.environ["RUN_ID"]
          attempt = os.environ["RUN_ATTEMPT"]

          tag = f"sha-{short_sha}-{run_id}-{attempt}"

          if not isinstance(services, list):
              raise ValueError("Services must be a JSON array")

          if len(services) != len(set(services)):
              raise ValueError("Duplicate services detected")

          for service in services:
              if service not in allowed:
                  raise ValueError(f"Unexpected service: {service}")

              # Do not promote an image if its service source
              # has changed on main since this build started.
              result = subprocess.run(
                  [
                      "git", "diff", "--quiet",
                      source_sha, "HEAD", "--",
                      f"apps/{service}",
                  ],
                  check=False,
              )

              if result.returncode == 1:
                  print(f"Skipping {service}: newer source on main")
                  continue

              if result.returncode != 0:
                  raise RuntimeError(
                      f"Failed to compare source for {service}"
                  )

              path = Path(f"helm/{service}/values-dev.yaml")

              if not path.is_file():
                  raise FileNotFoundError(path)

              lines = path.read_text().splitlines(
                  keepends=True
              )

              in_image = False
              updated = 0

              for i, line in enumerate(lines):
                  if line.strip() == "image:" and not line[0].isspace():
                      in_image = True
                      continue

                  if in_image and line.strip() and not line[0].isspace():
                      in_image = False

                  if in_image and re.match(r"^  tag:", line):
                      lines[i] = f'  tag: "{tag}"\n'
                      updated += 1

              if updated != 1:
                  raise ValueError(
                      f"Expected one image.tag in {path}, "
                      f"found {updated}"
                  )

              path.write_text("".join(lines))
              print(f"Updated {service}: {tag}")
          PY

            git add helm/*/values-dev.yaml

            if git diff --cached --quiet; then
              echo "No image tag updates required"
              exit 0
            fi

            git diff --cached --stat

            git commit -m \
              "chore(gitops): promote images ${IMAGE_TAG}"

            if git push origin HEAD:main; then
              echo "Helm image tags pushed successfully"
              exit 0
            fi

            echo "Push failed; retrying with latest main..."
            sleep 3
          done

          echo "Failed to push after 5 attempts"
          exit 1
