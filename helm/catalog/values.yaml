replicaCount: 1

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: catalog

service:
  type: ClusterIP
  port: 80

containerPort: 8080

database:
  provider: in-memory
  endpoint: ""
  name: catalogdb
  existingSecret: ""
  usernameKey: username
  passwordKey: password

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

probes:
  startup:
    path: /health
    failureThreshold: 30
    periodSeconds: 5
  readiness:
    path: /health
    periodSeconds: 10
  liveness:
    path: /health
    periodSeconds: 20