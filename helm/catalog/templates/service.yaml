apiVersion: v1
kind: Service
metadata:
  name: {{ include "retail.fullname" . }}
  labels:
    {{- include "retail.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP

  selector:
    {{- include "retail.selectorLabels" . | nindent 4 }}