replicaCount: 1

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: checkout

service:
  type: ClusterIP
  port: 80

containerPort: 8080

redis:
  provider: in-memory
  url: ""

endpoints:
  orders: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

probes:
  startup:
    periodSeconds: 5
    failureThreshold: 30
  readiness:
    periodSeconds: 10
  liveness:
    periodSeconds: 20