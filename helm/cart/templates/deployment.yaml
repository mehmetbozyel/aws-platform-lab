apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "retail.fullname" . }}
  labels:
    {{- include "retail.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "retail.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "retail.selectorLabels" . | nindent 8 }}

    spec:
      serviceAccountName: {{ include "retail.serviceAccountName" . }}
      automountServiceAccountToken: false

      containers:
        - name: cart
          image: "{{ required "image.repository required" .Values.image.repository }}:{{ required "image.tag required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP

          env:
            - name: PORT
              value: {{ .Values.containerPort | quote }}

            - name: AWS_REGION
              value: {{ .Values.aws.region | quote }}

            - name: RETAIL_CART_PERSISTENCE_PROVIDER
              value: {{ .Values.dynamodb.provider | quote }}

            {{- if eq .Values.dynamodb.provider "dynamodb" }}
            - name: RETAIL_CART_PERSISTENCE_DYNAMODB_TABLE_NAME
              value: {{ required "dynamodb.tableName required" .Values.dynamodb.tableName | quote }}

            - name: RETAIL_CART_PERSISTENCE_DYNAMODB_CREATE_TABLE
              value: {{ .Values.dynamodb.createTable | quote }}
            {{- end }}

          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}

          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}

          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault